<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Новый код сертификата</title><link rel="stylesheet" href="assets/site.css"><body class="cert-page"><main class="cert-main"><a href="index.html">Моноид · Safety Evals</a><h1>Создать код сертификата</h1><p>Новый случайный код для строки graduates.csv. Генерация происходит только в браузере.</p><div class="actions"><button id="generate">Создать новый код</button></div><output id="new-code" aria-live="polite" style="user-select:all;overflow-wrap:anywhere"></output><p>Скопируйте код в поле code, затем добавьте данные выпускника в GitHub.</p></main><script>document.getElementById('generate').onclick=()=>{const bytes=crypto.getRandomValues(new Uint8Array(24));document.getElementById('new-code').textContent=btoa(String.fromCharCode(...bytes)).replaceAll('+','-').replaceAll('/','_');};</script></body></html>
